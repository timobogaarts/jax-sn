name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:        # run by release.yml before publishing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      # XLA CPU deadlock on 2-vCPU runners (batched LU co-scheduled on the Eigen pool it blocks);
      # see the Build docs step in docs-pages.yml for the full explanation.
      XLA_FLAGS: "--xla_cpu_enable_concurrency_optimized_scheduler=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install jax-sn
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,geometry,warp]"

      # Hosted runners are CPU-only: fast tests only, Pallas tests skipped (see tests/conftest.py).
      - name: Run tests
        run: pytest --jax-platform=cpu
