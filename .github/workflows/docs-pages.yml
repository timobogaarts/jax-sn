name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install project and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[geometry]"
          pip install -r docs/requirements.txt

      # TEMPORARY: the parametrization notebook's gradient cell times out (>600s) here
      # while taking ~3s locally on identical package versions. This reproduces just that
      # cell with compile logging and a periodic stack dump, so the log says whether it is
      # sitting in XLA compilation, in a runtime execute, or in Python. Remove once known.
      - name: Diagnose parametrization gradient cell
        timeout-minutes: 8
        continue-on-error: true
        run: python -u tools/debug_parametrization_cell.py

      # Same run with equinox's runtime error checks compiled out, which removes the
      # jax.pure_callback that eqx.error_if embeds in the graph (the level computation
      # uses two). If this one passes while the one above hangs, the callback is the cause.
      - name: Diagnose again with equinox runtime errors off
        timeout-minutes: 8
        continue-on-error: true
        env:
          EQX_ON_ERROR: "off"
        run: python -u tools/debug_parametrization_cell.py

      - name: Build docs
        run: bash build_docs.sh

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
