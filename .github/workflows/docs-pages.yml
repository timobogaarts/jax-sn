name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install project and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[geometry]"
          pip install -r docs/requirements.txt

      # TEMPORARY: the parametrization notebook's gradient cell times out (>600s) here
      # while taking ~3s locally on identical package versions. Compilation and the forward
      # pass are already cleared; this run adds a CPU-time sampler (computing vs blocked)
      # and sweeps three problem sizes (a wall only the largest hits is compute, one every
      # size hits is a deadlock). Remove once known.
      # - name: Diagnose parametrization gradient cell
      #   timeout-minutes: 6
      #   continue-on-error: true
      #   run: python -u tools/debug_parametrization_cell.py

      # # Same run with XLA's CPU backend restricted to single-threaded Eigen. The runner
      # # has 2 vCPUs; if a nested parallel region in the backward pass is waiting on tasks
      # # that a 2-thread pool can never schedule, this makes it complete.
      # - name: Diagnose again with single-threaded Eigen
      #   timeout-minutes: 6
      #   continue-on-error: true
      #   env:
      #     XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
      #   run: python -u tools/debug_parametrization_cell.py

      - name: Build docs
        run: bash build_docs.sh

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
