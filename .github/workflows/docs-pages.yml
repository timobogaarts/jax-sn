name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install project and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[geometry]"
          pip install -r docs/requirements.txt

      - name: Build docs
        # Works around a deadlock in XLA's CPU backend that hangs the parametrization
        # notebook's gradient cell forever (it timed out at 600 s here while taking ~3 s
        # on any developer machine). jaxlib's batched LU kernel -- reached from the
        # jnp.linalg.inv calls in the transport operator and the FEM Jacobians --
        # parallelises over the Eigen thread pool and then blocks on a BlockingCounter
        # waiting for those subtasks, while itself running *on* that pool. The pool has
        # one thread per core, so when the concurrency-optimised scheduler starts two LU
        # thunks at once on a 2-vCPU runner both workers are blocked and no thread is
        # left to run the subtasks. Three or more cores always leave a spare worker,
        # which is why this only ever appears in CI. Disabling that scheduler stops the
        # two LU thunks being co-scheduled. Remove once jaxlib no longer blocks inside
        # the pool it is running on.
        env:
          XLA_FLAGS: "--xla_cpu_enable_concurrency_optimized_scheduler=false"
        run: bash build_docs.sh

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
