[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-sn"
version = "0.1.0"
description = "JAX-based Discrete Ordinates"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy",
    "scipy",
    "fenics-basix>=0.7.0",
    "equinox",
    "lineax",
    "warp-lang",
    # typing_extensions.Self: typing.Self is 3.11+, requires-python is >=3.9.
    "typing_extensions"
]

[project.optional-dependencies]
# Mesh/BVH and Cartesian-setup helpers (mesh_tools, domain_generation).
geometry = ["jax_sbgeom"]
# Test suite (test_finite_elements pulls in sympy for the reference basis).
test = ["pytest", "sympy"]
# Documentation build (./build_docs.sh).
docs = ["sphinx", "furo", "sphinx-autodoc-typehints", "myst-nb", "ipykernel", "matplotlib"]
# Repo dev tooling (pre-commit hooks, notebook output stripping).
dev = ["pre-commit", "nbstripout"]

[project.urls]
"Homepage" = "https://github.com/timobogaarts/jax-sn"
"Repository" = "https://github.com/timobogaarts/jax-sn"

[tool.setuptools.packages.find]
where = ["src"]

