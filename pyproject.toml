[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-sn"
version = "0.1.0"
description = "JAX-based Discrete Ordinates"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy",
    "scipy",
    "fenics-basix>=0.7.0",
    "equinox",
    "lineax"
]

[project.optional-dependencies]
# GPU warp-kernel transport sweep (transport_operator_warp,
# linear_tetrahedron_warp_kernel). Guarded by try/except at import.
warp = ["warp-lang"]
# Mesh/BVH and Cartesian-setup helpers (mesh_tools, domain_generation).
# jax_sbgeom is currently distributed via git, not PyPI; install it directly
# from its repository if `pip install jax-sn[geometry]` cannot resolve it.
geometry = ["jax_sbgeom"]
# Test suite (test_finite_elements pulls in sympy for the reference basis).
test = ["pytest", "sympy"]

[project.urls]
"Homepage" = "https://github.com/timobogaarts/jax-sn"
"Repository" = "https://github.com/timobogaarts/jax-sn"

[tool.setuptools.packages.find]
where = ["src"]

