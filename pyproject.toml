[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-sn"
version = "0.1.0"
description = "JAX-based Discrete Ordinates"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy",
    "scipy",
    "fenics-basix>=0.7.0",
    "equinox",
    "lineax",
    "warp-lang>=1.16.0",  # jax_callable FFI targets registered for CPU, needed to run Warp notebook cells in hosted (GPU-less) CI
    # typing_extensions.Self: typing.Self is 3.11+, requires-python is >=3.9.
    "typing_extensions"
]

[project.optional-dependencies]
# Mesh/BVH and Cartesian-setup helpers (mesh_tools, domain_generation).
geometry = ["jax_sbgeom"]
# Domain visualization (tools/plotly.py). Not imported eagerly by jax_sn.tools, so this is
# only needed if you actually call jax_sn.tools.plotly.plot_domain.
viz = ["plotly"]
# Test suite (test_finite_elements pulls in sympy for the reference basis).
test = ["pytest", "sympy"]
# Documentation build (./build_docs.sh).
docs = ["sphinx", "furo", "sphinx-autodoc-typehints", "myst-nb", "ipykernel", "matplotlib", "plotly"]
# Repo dev tooling (pre-commit hooks, notebook output stripping).
dev = ["pre-commit", "nbstripout"]

[project.urls]
"Homepage" = "https://github.com/timobogaarts/jax-sn"
"Repository" = "https://github.com/timobogaarts/jax-sn"

[tool.setuptools.packages.find]
where = ["src"]

